# OpenShift-only (route.openshift.io is the other OpenShift-only manifest —
# install.sh applies both only when it detects an OpenShift cluster).
#
# Grants the app's service account read access to OpenShift's built-in
# cluster-monitoring Prometheus (prometheus-k8s.openshift-monitoring.svc),
# via the "cluster-monitoring-view" ClusterRole that ships with OpenShift
# itself (not defined by this app). Needed only if you point PROMETHEUS_URL
# at that in-cluster Prometheus instead of a separate one — see "VM CPU/memory
# history charts" in the README.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubevirt-tools-cluster-monitoring-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: kubevirt-tools-sa
    namespace: kubevirt-tools
