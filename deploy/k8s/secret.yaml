apiVersion: v1
kind: Secret
metadata:
  name: kubevirt-tools-secret
  namespace: kubevirt-tools
type: Opaque
stringData:
  # ---- Needed on every cluster (Kubernetes and OpenShift alike) ----

  # SECRET_KEY_BASE is optional: if omitted, the app generates a random one
  # at boot. Set it explicitly only if you need sessions to survive pod
  # restarts (e.g. `mix phx.gen.secret` or `openssl rand -base64 48`).
  # SECRET_KEY_BASE: "your_secret_key_base"
  # PHX_HOST must match the hostname you type into the browser to reach the
  # app, or the dashboard's LiveView WebSocket connection will be rejected.
  # "localhost" is correct for `kubectl port-forward`. Deploying behind a
  # Route/Ingress/NodePort? Use that hostname instead — see "Setting
  # PHX_HOST" in the README for details and a per-exposure-method table.
  # On OpenShift, that's the Route's generated host — install.sh prints it
  # after installing, or get it yourself:
  #   oc -n kubevirt-tools get route kubevirt-tools-route -o jsonpath='{.spec.host}'
  # It looks like: kubevirt-tools-route-kubevirt-tools.apps.<your-cluster-domain>
  PHX_HOST: "localhost"
  PORT: "4000"
  # PROMETHEUS_URL is optional: defaults to "http://localhost:9090" if omitted.
  # Only needed for the VM CPU/memory history charts — everything else works
  # without it. Set it to your own Prometheus (no auth/TLS setup needed):
  # PROMETHEUS_URL: "http://prometheus.monitoring.svc:9090"
  # ...or on OpenShift, reuse the built-in cluster-monitoring Prometheus
  # instead (also needs PROMETHEUS_INSECURE_SKIP_TLS_VERIFY below, and the
  # cluster-monitoring-view RBAC install.sh already applies automatically):
  # PROMETHEUS_URL: "https://prometheus-k8s.openshift-monitoring.svc.cluster.local:9091"
  # The app automatically sends its own in-cluster service-account token as a
  # Bearer credential on every request (harmless if the target doesn't
  # require it) — only point this at a Prometheus you trust.

  # ---- OpenShift only — not needed on plain Kubernetes/KubeVirt ----
  # See "Kubernetes vs OpenShift" in the README for the full picture.

  # KUBERNETES_INSECURE_SKIP_TLS_VERIFY: only needed if the API server's
  # certificate isn't trusted by the pod's CA bundle — common on self-signed /
  # on-prem clusters (some OpenShift installs). Without it, the in-cluster
  # service-account sign-in silently fails its reachability check and falls
  # back to the manual kubeconfig upload screen with no error shown.
  # Accepts: true, 1, yes, on (case-insensitive). Leave unset to verify TLS.
  # KUBERNETES_INSECURE_SKIP_TLS_VERIFY: "true"
  # PROMETHEUS_INSECURE_SKIP_TLS_VERIFY: only needed if PROMETHEUS_URL points
  # at OpenShift's built-in cluster-monitoring Prometheus (its certificate is
  # signed by OpenShift's internal service-ca, not in the pod's default trust
  # store). Not needed if you deployed your own Prometheus instead.
  # PROMETHEUS_INSECURE_SKIP_TLS_VERIFY: "true"
