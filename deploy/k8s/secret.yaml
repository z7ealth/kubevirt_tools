apiVersion: v1
kind: Secret
metadata:
  name: kubevirt-tools-secret
  namespace: kubevirt-tools
type: Opaque
stringData:
  # SECRET_KEY_BASE is optional: if omitted, the app generates a random one
  # at boot. Set it explicitly only if you need sessions to survive pod
  # restarts (e.g. `mix phx.gen.secret` or `openssl rand -base64 48`).
  # SECRET_KEY_BASE: "your_secret_key_base"
  # PHX_HOST must match the hostname you type into the browser to reach the
  # app, or the dashboard's LiveView WebSocket connection will be rejected.
  # "localhost" is correct for `kubectl port-forward`. Deploying behind a
  # Route/Ingress/NodePort? Use that hostname instead — see "Setting
  # PHX_HOST" in the README for details and a per-exposure-method table.
  PHX_HOST: "localhost"
  PORT: "4000"
  # PROMETHEUS_URL is optional: defaults to "http://localhost:9090" if omitted.
  # Set it if Prometheus lives elsewhere, e.g. an in-cluster Service URL. The
  # app automatically sends its own in-cluster service-account token as a
  # Bearer credential on every request (harmless if not required) — only
  # point this at a Prometheus you trust. On OpenShift, pointing this at the
  # built-in cluster-monitoring Prometheus also needs `install.sh
  # --openshift-monitoring` (grants read access via cluster-monitoring-view).
  # PROMETHEUS_URL: "http://prometheus.monitoring.svc:9090"
  # PROMETHEUS_INSECURE_SKIP_TLS_VERIFY is optional: only needed if
  # PROMETHEUS_URL's certificate isn't trusted by the pod's CA bundle (e.g.
  # OpenShift's cluster-monitoring Prometheus uses a service-ca-signed cert).
  # Accepts: true, 1, yes, on (case-insensitive). Leave unset to verify TLS.
  # PROMETHEUS_INSECURE_SKIP_TLS_VERIFY: "true"
  # KUBERNETES_INSECURE_SKIP_TLS_VERIFY is optional: only needed if the API
  # server's certificate isn't trusted by the pod's CA bundle (common on
  # self-signed / on-prem clusters, e.g. some OpenShift installs) — the
  # in-cluster service-account sign-in will otherwise silently fail its
  # reachability check and fall back to the manual kubeconfig upload screen.
  # Accepts: true, 1, yes, on (case-insensitive). Leave unset to verify TLS.
  # KUBERNETES_INSECURE_SKIP_TLS_VERIFY: "true"
